name = "numa-account"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
PUBLIC_URL = "https://numa-account.REPLACE_SUBDOMAIN.workers.dev"
GOOGLE_CLIENT_ID = "REPLACE_GOOGLE_WEB_CLIENT_ID"

[[d1_databases]]
binding = "DB"
database_name = "numa-account"
database_id = "REPLACE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CONNECT_HUB"
class_name = "ConnectHub"

[[migrations]]
tag = "connect-hub-v1"
new_sqlite_classes = ["ConnectHub"]

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
